name: tmp-mh-assets-transfer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  transfer:
    if: github.head_ref == 'tmp-mh-assets-transfer-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build temporary transfer chunks on main
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(mktemp -d)
          mkdir -p "$OUT/hm08" "$OUT/bodyshapes"
          MH2_COMMIT=2e4cb35cb15fd53107ed4ad15b253d9b8a390738
          MH_TAG=v1.3.0
          curl -L --fail --retry 4 "https://raw.githubusercontent.com/makehumancommunity/makehuman2/${MH2_COMMIT}/data/rigs/hm08/default.mhskel" -o "$OUT/hm08/default.mhskel"
          curl -L --fail --retry 4 "https://raw.githubusercontent.com/makehumancommunity/makehuman2/${MH2_COMMIT}/data/rigs/hm08/default_weights.mhw" -o "$OUT/hm08/default_weights.mhw"
          for name in \
            bodyshapes-elvs-fem-apple \
            bodyshapes-elvs-fem-diamond \
            bodyshapes-elvs-fem-full-hourglass \
            bodyshapes-elvs-fem-neat-hourglass \
            bodyshapes-elvs-fem-invert-triangle \
            bodyshapes-elvs-fem-lean-column \
            bodyshapes-elvs-fem-rectangle \
            bodyshapes-elvs-fem-triangle \
            bodyshapes-elvs-man-apple \
            bodyshapes-elvs-man-rectangle \
            bodyshapes-elvs-man-lean-column \
            bodyshapes-elvs-man-triangle \
            bodyshapes-elvs-man-invert-triangle \
            bodyshapes-elvs-man-trapezoid
          do
            curl -L --fail --retry 4 "https://raw.githubusercontent.com/makehumancommunity/makehuman/${MH_TAG}/makehuman/data/targets/bodyshapes/${name}.target" -o "$OUT/bodyshapes/${name}.target"
          done
          (cd "$OUT" && sha256sum hm08/* bodyshapes/* > SHA256SUMS.txt)
          printf 'makehuman2_commit=%s\nmakehuman_tag=%s\nassets_license=CC0\n' "$MH2_COMMIT" "$MH_TAG" > "$OUT/SOURCE_PINS.txt"
          XZ_OPT='-9e -T0' tar -C "$OUT" -cJf /tmp/makehuman-internal-assets.tar.xz .
          rm -rf tmp_mh_chunks
          mkdir -p tmp_mh_chunks
          base64 -w 0 /tmp/makehuman-internal-assets.tar.xz | fold -w 6000 | split -l 1 -d -a 3 - tmp_mh_chunks/chunk-
          SHA=$(sha256sum /tmp/makehuman-internal-assets.tar.xz | awk '{print $1}')
          BYTES=$(stat -c %s /tmp/makehuman-internal-assets.tar.xz)
          CHUNKS=$(find tmp_mh_chunks -type f -name 'chunk-*' | wc -l)
          printf 'sha256=%s\nbytes=%s\nchunks=%s\nchunk_chars=6000\n' "$SHA" "$BYTES" "$CHUNKS" > tmp_mh_chunks/MANIFEST.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A tmp_mh_chunks
          git commit -m "tmp: publish MakeHuman transfer chunks"
          git push origin HEAD:main
